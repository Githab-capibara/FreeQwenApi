# ZAP rule configuration for the FreeQwenApi API scan.
#
# Format: <rule-id><TAB><level><TAB><description>
# Levels: OFF | IGNORE | INFO | WARN | FAIL
#
# The default ZAP API-scan configuration reports every rule as WARN, and the
# job fails on any WARN that is not listed here. The rules below are the
# accepted, pre-existing findings of the application. Every other rule stays
# blocking, so a new DAST finding breaks the build.
#
# 10021 - X-Content-Type-Options header missing.
#         The Express application does not set the header on any response.
#         Tracked as application hardening debt; not introduced by CI.
10021	IGNORE	X-Content-Type-Options header missing (pre-existing application hardening debt)
#
# 10037 - Server leaks information via the "X-Powered-By" response header.
#         Express sets "X-Powered-By: Express" by default. Tracked as
#         application hardening debt; not introduced by CI.
10037	IGNORE	Server leaks information via the X-Powered-By response header (pre-existing application hardening debt)
#
# 10116 - ZAP is out of date.
#         Pure scanner-version noise that has nothing to do with the
#         application under test.
10116	IGNORE	ZAP is out of date (scanner version noise)
