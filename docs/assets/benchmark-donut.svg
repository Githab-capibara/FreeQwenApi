<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="FreeQwenApi benchmark donut">
  <title>FreeQwenApi benchmark donut</title>
  <g transform="translate(160,160)">
    <!-- 92% tool-call accuracy (green) -->
    <circle r="100" fill="none" stroke="#2ecc71" stroke-width="34"
            stroke-dasharray="579.6 628.3" transform="rotate(-90)"/>
    <!-- 100% streaming (blue) -->
    <circle r="100" fill="none" stroke="#3498db" stroke-width="34"
            stroke-dasharray="628.3 628.3" stroke-dashoffset="-579.6"
            transform="rotate(-90)"/>
    <!-- 850ms first-token share (orange) -->
    <circle r="100" fill="none" stroke="#e67e22" stroke-width="34"
            stroke-dasharray="150 628.3" stroke-dashoffset="-1207.9"
            transform="rotate(-90)"/>
    <!-- 3.2s total-response share (purple) -->
    <circle r="100" fill="none" stroke="#9b59b6" stroke-width="34"
            stroke-dasharray="300 628.3" stroke-dashoffset="-1357.9"
            transform="rotate(-90)"/>
    <circle r="74" fill="#0d1117"/>
    <text x="0" y="-6" text-anchor="middle" fill="#e6edf3" font-family="sans-serif" font-size="26" font-weight="700">92%</text>
    <text x="0" y="20" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="12">tool accuracy</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#e6edf3">
    <rect x="14" y="286" width="12" height="12" fill="#2ecc71"/><text x="32" y="296">Tool accuracy 92%</text>
    <rect x="170" y="286" width="12" height="12" fill="#3498db"/><text x="188" y="296">Streaming 100%</text>
    <rect x="14" y="304" width="12" height="12" fill="#e67e22"/><text x="32" y="314">First token ~850ms</text>
    <rect x="170" y="304" width="12" height="12" fill="#9b59b6"/><text x="188" y="314">Response ~3.2s</text>
  </g>
</svg>
