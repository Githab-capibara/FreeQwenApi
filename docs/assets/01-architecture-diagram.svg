<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="FreeQwenApi architecture diagram">
  <title>FreeQwenApi architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box { fill:#161b22; stroke:#30363d; stroke-width:1.5; rx:8; }
      .t   { fill:#e6edf3; font-family:sans-serif; font-size:12; font-weight:600; text-anchor:middle; }
      .s   { fill:#8b949e; font-family:sans-serif; font-size:10; text-anchor:middle; }
      .edge{ stroke:#8b949e; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- Clients -->
  <rect class="box" x="20" y="120" width="150" height="80" rx="8"/>
  <text class="t" x="95" y="150">Client apps</text>
  <text class="s" x="95" y="168">OpenAI SDK / Open WebUI</text>
  <text class="s" x="95" y="182">Hermes / Claude Code / Codex</text>

  <!-- Proxy -->
  <rect class="box" x="230" y="60" width="170" height="180" rx="8"/>
  <text class="t" x="315" y="92">FreeQwenApi Proxy</text>
  <text class="s" x="315" y="116">Express server :3264/api</text>
  <text class="s" x="315" y="132">Anthropic messages shim</text>
  <text class="s" x="315" y="148">Tool prompt adapter</text>
  <text class="s" x="315" y="164">Account manager</text>
  <text class="s" x="315" y="180">Round-robin rotation</text>
  <text class="s" x="315" y="196">Puppeteer browser pool</text>

  <!-- Qwen -->
  <rect class="box" x="470" y="120" width="170" height="80" rx="8"/>
  <text class="t" x="555" y="150">Qwen Chat</text>
  <text class="s" x="555" y="168">chat.qwen.ai</text>

  <!-- WAF -->
  <rect class="box" x="680" y="120" width="60" height="80" rx="8"/>
  <text class="t" x="710" y="150">WAF</text>
  <text class="s" x="710" y="168">x5sec</text>

  <!-- edges -->
  <path class="edge" d="M170,160 C200,160 200,150 230,150"/>
  <path class="edge" d="M400,150 C440,150 440,160 470,160"/>
  <path class="edge" d="M640,160 C660,160 660,160 680,160"/>
</svg>
