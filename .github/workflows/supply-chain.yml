name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Area 10 — CI/CD pipeline security
  # ---------------------------------------------------------------------------
  workflow-lint:
    name: Workflow lint and hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          source .github/scanner-images.env
          if ! docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            "${ACTIONLINT_IMAGE}" \
            -color; then
            echo "::error title=actionlint::workflow lint reported problems"
            exit 1
          fi

      - name: zizmor — GitHub Actions security analysis
        run: |
          set -euo pipefail
          source .github/scanner-images.env
          if ! docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            "${ZIZMOR_IMAGE}" \
            --persona=auditor \
            --min-severity=low \
            --format=plain \
            .; then
            echo "::error title=zizmor::workflow hardening findings"
            exit 1
          fi

      - name: pinact — verify that every action is pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          # Validation only: the action must never rewrite workflow files and
          # must never open a pull request from within the pipeline.
          fix: 'false'
          no_api: 'false'

  # ---------------------------------------------------------------------------
  # Area 10 — OpenSSF Scorecard for the repository itself
  # ---------------------------------------------------------------------------
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # Required to publish the Scorecard results as a code-scanning alert.
      id-token: write         # Required to request the OIDC token that identifies the workflow run.
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: warn
          retention-days: 14
