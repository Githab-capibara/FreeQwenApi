name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write  # Required to upload CodeQL SARIF results to code scanning.
      actions: read         # Required by the CodeQL action to read the workflow run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      # The repository root action is a stub that always fails; the real
      # entry points are the `init` and `analyze` sub-actions.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@913e1bb775545322a3613f16c3483c0ac3050da5 # v4.0.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@913e1bb775545322a3613f16c3483c0ac3050da5 # v4.0.0
        with:
          category: '/language:${{ matrix.language }}'

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: ignore
          retention-days: 7
