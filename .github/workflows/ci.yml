name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Least privilege by default; individual jobs raise permissions only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  security-regressions:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security regression tests
        run: |
          node --test tests/security/*.test.js
          python -m unittest discover -s tests/security -p 'test_*.py' -v

  lockfile-consistency:
    name: Lockfile consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify package-lock.json matches package.json
        run: |
          npm ci --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error title=Lockfile::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' and commit the result."
            exit 1
          fi

  contract-parity:
    name: API contract parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Verify that the contract, the Node router and the Python entrypoint agree
        run: bash scripts/ci/verify-api-contract-parity.sh

  shell-lint:
    name: CI helper lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck on the CI helper scripts
        run: |
          set -euo pipefail
          shellcheck --severity=warning scripts/ci/*.sh

      - name: Check the shell syntax of the CI helper scripts
        run: |
          set -euo pipefail
          for script in scripts/ci/*.sh; do
            bash -n "${script}"
          done

  ci-gate:
    name: CI gate
    needs:
      - node-tests
      - python-tests
      - security-regressions
      - lockfile-consistency
      - contract-parity
      - shell-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required checks passed
        run: |
          echo "All required CI jobs passed."
